name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Under -race: these libraries are concurrent by nature, and a data race
      # in one produces wrong behaviour under load rather than a failing test.
      # The detector costs about a second here; `go build` above covers the
      # non-race compile.
      - name: Test
        run: go test -race ./...
